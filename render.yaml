services:
  - type: web
    name: sano-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  - type: web
    name: sano-ai
    runtime: python
    rootDir: sano-ai
    buildCommand: pip install -r requirements.txt
    startCommand: bash startup.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
